name: バグ報告 / Bug report
description: 動作しない・期待と異なる挙動の報告
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 何が起きたか / What happened
      description: 実際の挙動と期待した挙動
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順 / Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン / Version
      placeholder: v0.1.0
  - type: textarea
    id: env
    attributes:
      label: 環境 / Environment
      placeholder: "OS: Windows 11 / ブラウザ: Chrome 138"
  - type: textarea
    id: evidence
    attributes:
      label: ログ・スクリーンショット / Logs & screenshots
